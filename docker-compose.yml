# Production / Dokploy: только приложение.
# PostgreSQL создаётся отдельно (Dokploy → Databases или docker-compose.db.yml локально).
# Обязательно: DATABASE_URL в Environment (internal host БД, см. docs/DATABASE.md).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-3000}:3000"
    # Локальные аватары (если не S3 — см. docs/AVATAR_STORAGE.md). При AVATAR_STORAGE=s3 том не обязателен.
    volumes:
      - friendsbets_avatars:/app/public/avatars

volumes:
  friendsbets_avatars:
