# Переменные — из файла .env в корне (локально) или из вкладки Environment в Dokploy.
# Секреты не подставляются через ${VAR:?…} — иначе compose падает до сборки, если Dokploy не передал env в shell.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - friendsbets_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - friendsbets

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - friendsbets_avatars:/app/public/avatars
    networks:
      - friendsbets

volumes:
  friendsbets_pg_data:
  friendsbets_avatars:

networks:
  friendsbets:
