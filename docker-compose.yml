services:
  postgres:
    image: postgres:16-alpine
    container_name: friendsbets-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: friendsbets
    volumes:
      - friendsbets_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d friendsbets"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  friendsbets_pg_data:
